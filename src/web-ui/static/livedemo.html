<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DanceRLE</title>

  <link rel="stylesheet" href="/static/livedemo.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
      }
    }
  </script>
</head>

<body>

  <div id="meter" aria-hidden="true">
    <div id="meter-fill"></div>
  </div>

  <header>
    <div class="header-inner">

      <div class="brand-title">
        <div class="brand-logo" aria-hidden="true"></div>
        <h1>DanceRLE</h1>
      </div>

      <div class="score-readout">
        <div id="score-value" class="score-value">–</div>
        <div id="score-label" class="score-label">match</div>
      </div>

    </div>
  </header>

  <main>

    <section class="toolbar" id="setup-card">

      <label class="video-select">
        <span>Video</span>

        <select id="job-select">
          <option value="">Loading…</option>
        </select>
      </label>

      <label class="button" id="upload-label">
        <input
          type="file"
          id="demo-file"
          accept="video/*,.mp4,.mov,.m4v,.webm,.avi,.mkv"
          hidden
        >
        Upload
      </label>

      <label>
        <span>Model</span>

        <select id="demo-model">
          <option value="lite">Lite</option>
          <option value="full" selected>Full</option>
          <option value="heavy">Heavy</option>
        </select>
      </label>

      <div id="demo-progress" hidden>
        <div class="progress-track">
          <div
            class="progress-fill"
            id="demo-progress-fill"
          ></div>
        </div>

        <p
          id="demo-progress-text"
          class="progress-text"
        ></p>
      </div>

    </section>

    <section
      class="toolbar controls"
      id="demo-controls"
    >

      <button id="cam-btn" class="primary">
        Start camera
      </button>

      <label class="button" id="cam-file-label">
        <input
          type="file"
          id="cam-file"
          accept="video/*,.mp4,.mov,.m4v,.webm,.avi,.mkv"
          hidden
        >
        Use video
      </label>

      <button id="rec-btn">
        ● Record
      </button>

      <label id="offset-control" hidden>
        <span title="The time in your video that lines up with the dancer's start">Offset</span>

        <input
          type="number"
          id="cam-offset"
          value="0"
          step="0.1"
        >
      </label>

      <button id="play-btn" disabled>
        ▶ Play
      </button>

      <button id="restart-btn" disabled>
        ↺ Restart
      </button>

      <label>
        <span>Speed</span>

        <select id="demo-speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
        </select>
      </label>

      <label>
        <span>Score</span>

        <select id="score-method">
          <option value="pose">Pose</option>
          <option value="dance" selected>Dance</option>
        </select>
      </label>

      <label class="toggle">
        <input
          type="checkbox"
          id="mirror-moves"
          checked
        >
        Mirror
      </label>

      <label class="toggle">
        <input
          type="checkbox"
          id="show-ghost"
          checked
        >
        Overlay
      </label>

    </section>

    <div class="hidden-status">
      <p id="demo-status"></p>
      <p id="score-detail"></p>
    </div>

    <div class="panels">

      <figure class="panel">

        <figcaption id="ref-caption">
          Reference
        </figcaption>

        <div
          class="stage"
          id="ref-stage"
        >

          <video
            id="ref-video"
            muted
            playsinline
            preload="auto"
          ></video>

          <canvas id="ref-overlay"></canvas>

          <div
            id="countdown"
            class="countdown"
            hidden
          ></div>

        </div>

      </figure>

      <figure class="panel">

        <figcaption id="cam-caption">
          You
        </figcaption>

        <div
          class="stage mirrored"
          id="cam-stage"
        >

          <video
            id="cam-video"
            muted
            playsinline
          ></video>

          <canvas id="ghost-overlay"></canvas>
          <canvas id="cam-overlay"></canvas>

          <div
            id="cam-countdown"
            class="countdown"
            hidden
          ></div>

        </div>

      </figure>

    </div>

  </main>

  <script
    type="module"
    src="/static/livedemo.js"
  ></script>

</body>
</html>
