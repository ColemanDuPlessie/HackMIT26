[project]
name = "pose-estimation"
version = "0.1.0"
description = "Single-video human pose -> MuJoCo qpos via MediaPipe + mink IK"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.11",
    "numpy",
    "scipy",
    "mujoco>=3.2",
    "mink",
    "daqp",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["extract_keypoints", "retarget", "visualize"]
